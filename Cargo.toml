[workspace]
resolver = "2"
members = [
    "crates/pdfboss-core",
    "crates/pdfboss-text",
    "crates/pdfboss-output",
    "crates/pdfboss-encoding",
    "crates/pdfboss-jpx",
    "crates/pdfboss-render",
    "crates/pdfboss-aio",
    "crates/pdfboss-cli",
    "crates/pdfboss-py",
    "crates/pdfboss-testkit",
    "crates/pdfboss-tui",
]

[workspace.package]
version = "0.15.0" # x-release-please-version
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4thel00z/pdfboss"
readme = "README.md"
keywords = ["pdf", "iso-32000"]

[workspace.dependencies]
# Inter-crate dependencies carry an explicit `version` (required by
# `cargo publish`) alongside the local `path`. The markers keep them in
# lockstep with the workspace version at release time.
pdfboss-core = { path = "crates/pdfboss-core", version = "0.15.0" } # x-release-please-version
pdfboss-encoding = { path = "crates/pdfboss-encoding", version = "0.15.0" } # x-release-please-version
pdfboss-jpx = { path = "crates/pdfboss-jpx", version = "0.15.0" } # x-release-please-version
pdfboss-text = { path = "crates/pdfboss-text", version = "0.15.0" } # x-release-please-version
pdfboss-output = { path = "crates/pdfboss-output", version = "0.15.0" } # x-release-please-version
pdfboss-render = { path = "crates/pdfboss-render", version = "0.15.0" } # x-release-please-version
pdfboss-aio = { path = "crates/pdfboss-aio", version = "0.15.0" } # x-release-please-version
pdfboss-tui = { path = "crates/pdfboss-tui", version = "0.15.0" } # x-release-please-version
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "fs", "sync", "io-util"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Release builds trade compile time for cross-crate inlining and tighter
# codegen on the CPU-bound parse/raster paths. `panic` is deliberately left as
# "unwind": the Python extension relies on unwinding to turn Rust panics into
# Python exceptions rather than aborting the interpreter.
[profile.release]
lto = "thin"
codegen-units = 1
