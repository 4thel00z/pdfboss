name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p pdfboss-aio --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p pdfboss-aio --all-features

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # The ISO 32000 gate: Lean checks the conformance ledger in iso32000/
  # against the source tree (see iso32000/Iso32000/Gate.lean). The index, the
  # vectors and the book chapter are regenerated so a stale committed copy
  # fails the job.
  iso32000:
    name: iso32000 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            iso32000/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('iso32000/lean-toolchain', 'iso32000/lakefile.toml') }}
      - name: Install Lean through elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install "$(cat iso32000/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Rescans the sources, lists any offending row before Lean runs, then checks the ledger.
      - name: Check the ledger
        run: make iso32000-gate
      - name: Regenerate the vectors and the book chapter
        run: make iso32000-vectors iso32000-report
      - name: Committed copies must match what the tree generates
        run: |
          if git diff --exit-code -- iso32000/Iso32000/Generated.lean crates/pdfboss-core/tests/vectors/iso32000 docs/src/reference/iso32000.md; then
            exit 0
          fi
          echo "::error::The committed ledger does not match what this tree generates. Run 'make iso32000-index iso32000-vectors iso32000-report' and commit the result. Do that after every merge from main, not only when you add a citation: Generated.lean is written in fixed-size chunks, so two branches that each regenerated it merge without a conflict into a file with the same citationsN defined twice."
          exit 1
