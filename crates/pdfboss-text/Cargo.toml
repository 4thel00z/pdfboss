[package]
name = "pdfboss-text"
description = "PDF text extraction in pure Rust: font loading, encodings, ToUnicode CMaps and positioned text spans"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["pdf", "text-extraction", "pdf-to-text", "fonts", "cmap"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
pdfboss-core = { workspace = true }
pdfboss-encoding = { workspace = true }

[dev-dependencies]
pdfboss-testkit = { path = "../pdfboss-testkit" }
# Tests exercise predefined CMap names, so the data rides along for the
# test build even when a consumer leaves the feature off.
pdfboss-core = { workspace = true, features = ["predefined-cmaps"] }
