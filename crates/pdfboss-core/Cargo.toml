[package]
name = "pdfboss-core"
description = "PDF parser in pure Rust: syntax, objects, filters, cross-references and the document model (ISO 32000)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["pdf", "parser", "pdf-parser", "iso-32000", "document"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
thiserror = "2"
# Pure-Rust zlib-rs inflate backend: faster than the default miniz_oxide
# backend and still C-free (keeps the dependency tree free of native code).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memchr = "2"

[features]
# Compiles in Adobe's predefined CJK CMap set (ISO 32000-1 Table 118;
# BSD-licensed data, see assets/cmaps/NOTICE), ~830 KB of zlib archives
# decompressed lazily per character collection. Without it, predefined
# names other than Identity-H/-V resolve to nothing and Type0 consumers
# keep their Identity fallback.
predefined-cmaps = []

[dev-dependencies]
pdfboss-testkit = { path = "../pdfboss-testkit" }
criterion = { workspace = true }

[[bench]]
name = "parse"
harness = false
