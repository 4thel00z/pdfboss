[package]
name = "pdfboss-render"
description = "PDF rendering in pure Rust: rasterize pages to RGBA pixmaps and PNG, extract embedded images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["pdf", "rendering", "rasterizer", "pdf-to-png", "png"]
categories = ["rendering", "multimedia::images", "graphics"]

[dependencies]
pdfboss-core = { workspace = true }
pdfboss-encoding = { workspace = true }
pdfboss-icc = { workspace = true }
pdfboss-jpx = { workspace = true }
png = "0.18"
jpeg-decoder = "0.3"

[features]
# Bundles the OFL Croscore substitute faces (Arimo/Tinos/Cousine) into the
# binary via `include_bytes!`, so `SubstituteSource::Builtin` has faces to
# hand out without a `--font-dir`. Adds ~4 MB to the binary; off by default.
substitute-fonts = []

[dev-dependencies]
pdfboss-testkit = { path = "../pdfboss-testkit" }
criterion = { workspace = true }
# Tests exercise predefined CMap names, so the data rides along for the
# test build even when a consumer leaves the feature off.
pdfboss-core = { workspace = true, features = ["predefined-cmaps"] }

[[bench]]
name = "render"
harness = false

[[bench]]
name = "tiers"
harness = false
